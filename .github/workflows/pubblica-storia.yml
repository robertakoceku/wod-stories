# Pubblicazione automatica della storia del WOD.
#
# Orari di pubblicazione (ora italiana):
#   lunedì → venerdì  alle 5:00
#   sabato e domenica alle 9:00
#
# Dal 24/11/26 NON si usano più gli orari di GitHub (`schedule`): GitHub li
# fa partire con ore di ritardo (il 23/11 alle 12:38, 14:52, 19:49, 20:59) e
# così la storia non usciva mai. Il workflow viene avviato all'ora esatta da
# un timer esterno (cron-job.org) tramite le API di GitHub, con prova=false.
# Vedi instagram/SETUP.md, sezione "Timer esterno".

name: Pubblica storia WOD

on:
  workflow_dispatch:           # permette di lanciarlo a mano dal sito
    inputs:
      data:
        description: "Data da pubblicare (AAAA-MM-GG). Vuoto = oggi."
        required: false
      prova:
        description: "Solo prova: controlla tutto ma non pubblica"
        type: boolean
        default: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pubblica la storia di oggi su Instagram e Facebook
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/stories
          ORA_FERIALE: "5"
          ORA_WEEKEND: "9"
          STORY_DATE: ${{ inputs.data }}
          DRY_RUN: ${{ inputs.prova && '1' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 instagram/publish_story.py
